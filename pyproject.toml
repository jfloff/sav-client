[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sav-client"
version = "0.100.1"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31",
    "python-dotenv>=1.0",
    "beautifulsoup4>=4.12",
    "click>=8.0",
    "rapidfuzz>=3.9",
    "mcp>=1.0,<2",
    "img2pdf>=0.5",
    "pikepdf>=8",
    "pypdf>=4",
    # Pinned: sav-api stops correcting anchor->slot as of 0.10.0, so an older
    # parser would place overlays on the labelled caption instead of the box.
    "sav-parsers @ git+https://github.com/jfloff/sav-parsers.git@ac80cfe",
]

[project.scripts]
sav = "sav_cli.cli:main"
sav-mcp = "sav_mcp.server:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["sav_client*", "sav_cli*", "sav_mcp*", "sav_shared*"]

[tool.setuptools.package-data]
sav_client = ["AGENTS.md"]
sav_cli = ["AGENTS.md"]
sav_mcp = ["AGENTS.md", "authz.toml"]
sav_shared = ["files/mod1/*.pdf"]

[tool.pytest.ini_options]
markers = [
    "live: test requires a real SAV account or network access",
]
